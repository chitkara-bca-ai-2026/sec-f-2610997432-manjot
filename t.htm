<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget and Status Tracker</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <table border="1">
        <!-- Task 2: Table Header Definition -->
        <thead>
            <tr>
                <th>Item</th>
                <th>Cost</th>
            </tr>
        </thead>

        <!-- Task 3: Table Body and Data Cells -->
        <tbody>
            <tr>
                <td>Design</td>
                <td>500</td>
            </tr>
            <tr>
                <td>Development</td>
                <td>1200</td>
            </tr>
        </tbody>

        <!-- Task 4 & Task 5: Table Summary Footer and Cell Spanning -->
        <tfoot>
            <tr>
                <td colspan="2">Total: 1700</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
