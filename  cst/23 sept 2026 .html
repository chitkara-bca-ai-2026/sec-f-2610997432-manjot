<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Me</title>
</head>
<body>

    <!-- Main heading with bold name -->
    <h1><b>John Doe</b></h1>

    <!-- Paragraph about themselves with an italic hobby and an underlined important word -->
    <p>
        Hello! I am a passionate web developer who enjoys <i>reading</i> and learning new technologies. 
        It is <u>essential</u> to keep practicing every day to improve programming skills.
    </p>

    <!-- Mathematical and chemical formulas using superscript and subscript -->
    <p>a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></p>
    <p>H<sub>2</sub>O</p>
    <p>CO<sub>2</sub></p>

    <!-- Horizontal line -->
    <hr>

</body>
</html>
