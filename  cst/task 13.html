<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Readers' Haven – Book Registration & Order Form</title>
</head>
<body>

    <h1>Readers' Haven – Book Registration & Order Form</h1>

   
    <form action="submit_order.php" method="POST" target="_blank" enctype="multipart/form-data">

       
        <input type="hidden" name="form_identifier" value="Readers Haven Book Order">

        <fieldset>
            <legend>Customer Information</legend>

            
            <p>
                <label for="customerName">Customer Name:*</label><br>
                <input type="text" id="customerName" name="customerName" placeholder="Enter your full name" required>
            </p>

            <p>
                <label for="email">Email Address:*</label><br>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </p>

            <p>
                <label for="mobile">Mobile Number:*</label><br>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </p>

            <p>
                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="5" max="100" placeholder="e.g. 25">
            </p>

            <p>
                <label for="password">Password:*</label><br>
                <input type="password" id="password" name="password" placeholder="Enter account password" required>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Book Preferences & Order Details</legend>

           
            <p>
                <label for="category">Favorite Book Category:*</label><br>
                <select id="category" name="category" required>
                    <option value="" disabled selected>-- Select a Category --</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="History">History</option>
                    <option value="Children's Books">Children's Books</option>
                </select>
            </p>

            
            <p>
                <label for="bookTitle">Book Title:*</label><br>
                <input type="text" id="bookTitle" name="bookTitle" placeholder="Enter title of the book" required>
            </p>

            <p>
                <label for="quantity">Quantity:*</label><br>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            </p>

            
            <p>
                <label>Preferred Payment Method:*</label><br>
                <input type="radio" id="cod" name="paymentMethod" value="Cash on Delivery" required>
                <label for="cod">Cash on Delivery</label>
                <input type="radio" id="online" name="paymentMethod" value="Online Payment">
                <label for="online">Online Payment</label>
            </p>

            
            <p>
                <label>Additional Services:</label><br>
                <input type="checkbox" id="giftWrap" name="services[]" value="Gift Wrapping">
                <label for="giftWrap">Gift Wrapping</label><br>

                <input type="checkbox" id="express" name="services[]" value="Bookmark Express Delivery">
                <label for="express">Bookmark Express Delivery</label><br>

                <input type="checkbox" id="card" name="services[]" value="Greeting Card">
                <label for="card">Greeting Card</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Delivery Details & Additional Options</legend>

            
            <p>
                <label for="deliveryDate">Delivery Date:</label><br>
                <input type="date" id="deliveryDate" name="deliveryDate">
            </p>

            <p>
                <label for="deliveryTime">Preferred Delivery Time:</label><br>
                <input type="time" id="deliveryTime" name="deliveryTime">
            </p>

            
            <p>
                <label for="deliveryAddress">Delivery Address & Special Instructions:*</label><br>
                <textarea id="deliveryAddress" name="deliveryAddress" rows="4" cols="50" placeholder="Street address, city, landmark, and special instructions..." required></textarea>
            </p>

            
            <p>
                <label for="referenceFile">Upload Reference Image/Document:</label><br>
                <input type="file" id="referenceFile" name="referenceFile" accept="image/*,.pdf">
            </p>
        </fieldset>

        <br>

        
        <button type="submit">Place Order</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
