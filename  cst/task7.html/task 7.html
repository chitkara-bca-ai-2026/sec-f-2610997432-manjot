<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on any region/country on the world map below to explore more information in a new tab.</p>

    
   <img src="image7/world_map.jpg" alt="World Map" usemap="#worldmap" width="1000">


    
    <map name="worldmap">
        
        <area shape="circle" coords="850,200,40" href="https://en.wikipedia.org/wiki/Japan" alt="Japan - Island Nation" target="_blank">

       
        <area shape="rect" coords="750,330,920,470" href="https://en.wikipedia.org/wiki/Australia" alt="Australia Continent" target="_blank">

        
        <area shape="poly" coords="660,200,720,200,740,280,680,310,660,260" href="https://en.wikipedia.org/wiki/India" alt="India" target="_blank">

       
        
    </map>

</body>
</html>
